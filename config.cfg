# PICO 4 Fan Auto Temp Control — user configuration
#
# This file is loaded by service.sh at startup. Any key that is not set here
# falls back to the built-in default. All values are in millidegrees C unless
# the key name says otherwise. Lines starting with '#' are comments.
#
# Edit this file with a text editor (notepad / vim), then either:
#   - reboot the module:  su -c 'setprop sys.pxrfanservice.state 2'
#     (restarting pxrfanservice does not reload this; you need to kill the
#      service.sh process, which the Magisk manager "reinstall" button does)
#   - or run:  su -c 'sh /data/adb/modules/pico4_fan_tempcontrol/action.sh restart'
#
# After editing, verify with:
#   su -c 'sh /data/adb/modules/pico4_fan_tempcontrol/action.sh status'

# --- Duty per tier (0-100 percent) ---------------------------------------
# QUIET fires when skin is below T0 (ambient is cold, no fan needed).
# Vendor itself drops to 0% around 36C; we match it here rather than idling
# at 45% which is pointless noise.
TIER_QUIET=0
TIER_IDLE=45        # 38-47C
TIER_WARM=55        # 47-50C
TIER_HOT=65         # 50-53C
TIER_VERYHOT=78     # 53-56C

# --- Thresholds (millidegrees C) ------------------------------------------
# The first threshold you cross moves you up. Hysteresis (see below) prevents
# a single-degree wobble from flipping you back down on the next loop.
T0=38000   # quiet -> idle  (below this, fan off)
T1=47000   # idle -> warm
T2=50000   # warm -> hot
T3=53000   # hot -> very hot
T4=56000   # very hot -> overheat (hands back to vendor for safety)

# --- Hysteresis (millidegrees C) ------------------------------------------
# Going DOWN a tier requires the skin to fall below (threshold - HYSTERESIS).
# 400 = 0.4C. Lower = snappier but more flapping; higher = lazier but the
# fan holds its speed a bit longer past a temperature change.
HYSTERESIS=400

# --- Loop timing ---------------------------------------------------------
# Main loop interval in seconds. Vendor re-issues every ~3s but test mode
# makes it irrelevant; this is just how often we re-evaluate.
LOOP_INTERVAL=5

# How long after boot_completed we wait before taking over. Gives the vendor
# services a moment to settle so we do not race them.
STARTUP_GRACE=45

# --- RPM cap -------------------------------------------------------------
# If the MCU reports an rpm at or above RPM_CAP, raise the duty to RPM_DUTY
# next loop. This catches the case where skin is still acceptable but the
# fan is already near its max and we want more headroom. Set RPM_CAP=0 to
# disable.
RPM_CAP=12000
RPM_DUTY=88
