# PICO 4 Fan Auto Temp Control — user configuration (patched)
#
# This file is loaded by service.sh at startup. Any key that is not set here
# falls back to the built-in default. All values are in millidegrees C unless
# the key name says otherwise. Lines starting with '#' are comments.
#
# 改完参数后：
#   su -c "sh /data/adb/modules/pico4_fan_tempcontrol/action.sh restart"
# 然后看状态：
#   su -c "sh /data/adb/modules/pico4_fan_tempcontrol/action.sh status"
# 纯逻辑自检（只读，不写风扇）：
#   su -c "sh /data/adb/modules/pico4_fan_tempcontrol/service.sh --selftest"

# --- Duty per tier (0-100 percent) ---------------------------------------
# QUIET = 风扇完全停转。
#
# TIER_IDLE 已从原来的 45 降到 25：实测 duty 45% ≈ 7746 RPM，
# 而原来 0% -> 45% 之间没有任何过渡档，等于一跨过 T0 就直接起飞到 7700RPM。
TIER_QUIET=0
TIER_IDLE=25        # T0-47C
TIER_WARM=55        # 47-50C
TIER_HOT=65         # 50-53C
TIER_VERYHOT=78     # 53-56C

# --- Thresholds (millidegrees C) ------------------------------------------
# 升档：跨过阈值立即上（安全优先，不带回滞）。
# 降档：必须低于 (对应阈值 - HYSTERESIS)，见下面的说明。
#
# T0 已从 38000 提到 41000。原因：PICO 4 息屏静置的皮肤温度实测就在
# 37.5-38.0C 之间上下飘，原来的 38.0C 正好卡在待机皮温上，配合第一档就是
# 45%(≈7700RPM)，会造成 0 <-> 7700 RPM 无限横跳（息屏、没在用、温度不高
# 但风扇反复起转，就是这个原因）。
T0=41000   # quiet -> idle
T1=47000   # idle -> warm
T2=50000   # warm -> hot
T3=53000   # hot -> very hot
T4=56000   # very hot -> overheat (hands back to vendor for safety)

# --- Hysteresis (millidegrees C) ------------------------------------------
# 降档需要低于 (该档阈值 - HYSTERESIS)。0.8C 起步。
#
# 注意：上游版本的 HYSTERESIS 实际上只在 QUIET 分支生效，其余档位是全靠
# 纯阈值比较，改这个参数几乎没用。修补版已实现完整回滞。
HYSTERESIS=800

# --- Loop timing ---------------------------------------------------------
LOOP_INTERVAL=5

# How long after boot_completed we wait before taking over.
STARTUP_GRACE=45

# --- RPM cap -------------------------------------------------------------
# 说明：上游这里是"温度被完全旁路 + 永久自锁"的坑。rpm 一旦 >= RPM_CAP，
# duty 就被固定成 RPM_DUTY，而该 duty 下 rpm 恒 >= RPM_CAP，条件永远成立，
# 于是转速再也降不下来（想降 rpm 必须先降 duty，降 duty 又要求 rpm 已经低）。
# 修补版加了一道温度闸门：只有温度档位 >= RPM_RELEASE_RANK 时才允许升速，
# 温度一回落闸门关闭，转速正常回落。
RPM_CAP=12000
RPM_DUTY=88

# --- 修补版新增参数 -------------------------------------------------------

# RPM 升速闸门：温度档位不低于该档时才允许因 rpm 偏高而升速。
#   0=QUIET 1=IDLE 2=WARM 3=HOT 4=VERYHOT
# 默认 3 (HOT，即皮肤 >= 50C)。实测 rpm 冲到 13600 时皮肤才 53C，
# 闸门设在 HOT 可以保证"热的时候给余量、温度一回落立刻松开"，
# 不会像上游那样在 47-56C 区间白吃 88% 的噪音并永久锁死。
RPM_RELEASE_RANK=3

# 过热交回原厂后，温度要降回该档才重新接管本模块。
#   3 = HOT (低于 53C)。上游是交回 5 秒就抢回来，高温柔性保护形同虚设。
OVERHEAT_RELEASE_RANK=3

# 写风扇失败后的重试间隔（秒）。
RETRY_BACKOFF=3

# 失败日志节流：每 N 次失败记一条（第 1 次总是记）。防止刷爆 logcat。
FAIL_LOG_EVERY=12

# 连续写入失败达到该次数后，放弃控制、退出 test mode 交还原厂。
# 没有这个上限时，一旦工具持续拒绝（固件变更 / 权限丢失 / MCU 异常），
# 模块会无限重试：MCU 卡在 test mode，厂商的 duty 帧也被拒，风扇没人管，
# 而 state 里还写着"本模块温控"。到上限就交还原厂，并写 state/gave_up。
# action.sh restart 或重启设备会重新尝试。
MAX_FAIL_STREAK=10

# --- 配置校验 -------------------------------------------------------------
# 本文件是被 source 进来的，service.sh 加载后会统一校验：
#   档位 duty      夹紧到 0-100
#   阈值 T0..T4    必须严格递增，否则回落 41/47/50/53/56 C
#   HYSTERESIS     上限 = 相邻档位最小间隔-1（否则永远降不下来）
#   LOOP_INTERVAL / RETRY_BACKOFF  下限 1（0 或非法值会让 sleep 立即返回，
#                  主循环退化成零延迟忙循环：binder 调用风暴 + 打满 CPU）
#   FAIL_LOG_EVERY 下限 1（0 会导致取模除零，失败日志彻底消失）
# 非法值会记一条日志并回落，用 service.sh --dumpcfg 看最终生效值。

# --- 本机实测的 duty -> RPM 曲线（2026-09-18，PICO A8110）-------------------
#   duty  0%  ->     0 RPM
#   duty 15%  ->  3456 RPM
#   duty 20%  ->  3488 RPM      <- 起步平台，约 3450 RPM 是能转起来的下限
#   duty 25%  ->  4346 RPM      <- 现在的 TIER_IDLE
#   duty 30%  ->  5132 RPM
#   duty 35%  ->  5973 RPM
#   duty 45%  ->  7548 RPM      <- 上游的 TIER_IDLE，待机一跨档就直接起飞
#   duty 65%  -> 10600 RPM
#   duty 78%  -> 12220 RPM
#   duty 88%  -> 13671 RPM
# 结论：上游 RPM_CAP=12000 大约对应 duty 73%，在 HOT/VERYHOT 档是能真实触发的，
#       所以那个"永久自锁"不是理论问题。
